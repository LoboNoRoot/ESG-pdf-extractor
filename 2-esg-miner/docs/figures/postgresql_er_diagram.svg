<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <style>
      .bg{fill:#f5f5f7}.table{fill:#fff;stroke:#d2d2d7;stroke-width:1.3}.head{fill:#eaf3ff;stroke:#b7d7ff;stroke-width:1}.text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#1d1d1f}.title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#6e6e73}.name{font-size:21px;font-weight:700}.field{font-size:15px;fill:#3a3a3c}.key{font-size:15px;fill:#0066cc;font-weight:650}.line{stroke:#86868b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#86868b"/></marker>
  </defs>
  <rect class="bg" width="1400" height="800"/>
  <text class="text title" x="70" y="74">PostgreSQL 表关系图</text>
  <text class="text sub" x="70" y="112">报告、任务、抽取结果、复核记录和产物索引的核心关系</text>

  <g transform="translate(80 180)">
    <rect class="table" width="260" height="245" rx="18"/>
    <rect class="head" width="260" height="54" rx="18"/>
    <text class="text name" x="130" y="35" text-anchor="middle">reports</text>
    <text class="text key" x="24" y="86">PK report_id</text>
    <text class="text field" x="24" y="118">filename</text>
    <text class="text field" x="24" y="150">company_name</text>
    <text class="text field" x="24" y="182">stock_code</text>
    <text class="text field" x="24" y="214">report_year</text>
  </g>

  <g transform="translate(430 165)">
    <rect class="table" width="270" height="285" rx="18"/>
    <rect class="head" width="270" height="54" rx="18"/>
    <text class="text name" x="135" y="35" text-anchor="middle">jobs</text>
    <text class="text key" x="24" y="86">PK job_id</text>
    <text class="text key" x="24" y="118">FK report_id</text>
    <text class="text field" x="24" y="150">status / mode / use_llm</text>
    <text class="text field" x="24" y="182">pdf_path / output_dir</text>
    <text class="text field" x="24" y="214">started_at / finished_at</text>
    <text class="text field" x="24" y="246">duration_seconds</text>
  </g>

  <g transform="translate(790 120)">
    <rect class="table" width="300" height="340" rx="18"/>
    <rect class="head" width="300" height="54" rx="18"/>
    <text class="text name" x="150" y="35" text-anchor="middle">extraction_results</text>
    <text class="text key" x="24" y="86">FK job_id</text>
    <text class="text key" x="24" y="118">FK report_id</text>
    <text class="text field" x="24" y="150">field_key / name_cn</text>
    <text class="text field" x="24" y="182">matched / value / unit / year</text>
    <text class="text field" x="24" y="214">numeric_value</text>
    <text class="text field" x="24" y="246">evidence / source_page</text>
    <text class="text field" x="24" y="278">confidence</text>
    <text class="text field" x="24" y="310">row_json</text>
  </g>

  <g transform="translate(790 525)">
    <rect class="table" width="300" height="190" rx="18"/>
    <rect class="head" width="300" height="54" rx="18"/>
    <text class="text name" x="150" y="35" text-anchor="middle">reviews</text>
    <text class="text key" x="24" y="86">FK job_id + field_key</text>
    <text class="text field" x="24" y="118">status</text>
    <text class="text field" x="24" y="150">value / unit / year / evidence</text>
    <text class="text field" x="24" y="176">reviewer_note</text>
  </g>

  <g transform="translate(1130 265)">
    <rect class="table" width="230" height="220" rx="18"/>
    <rect class="head" width="230" height="54" rx="18"/>
    <text class="text name" x="115" y="35" text-anchor="middle">artifacts</text>
    <text class="text key" x="24" y="86">FK job_id</text>
    <text class="text field" x="24" y="118">artifact_type</text>
    <text class="text field" x="24" y="150">path</text>
    <text class="text field" x="24" y="182">mime_type</text>
  </g>

  <path class="line" d="M340 302 H430"/>
  <path class="line" d="M700 302 H790"/>
  <path class="line" d="M940 460 V525"/>
  <path class="line" d="M1090 350 H1130"/>
  <path class="line" d="M700 350 C735 350 745 610 790 610"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .bg{fill:#f7f8fa}
      .card{fill:#ffffff;stroke:#d8dde6;stroke-width:2}
      .title{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;font-size:26px;font-weight:700;fill:#1f2937}
      .text{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;font-size:18px;fill:#374151}
      .small{font-family:"Microsoft YaHei","SimSun",Arial,sans-serif;font-size:15px;fill:#6b7280}
      .accent{stroke:#2f6feb;stroke-width:3;fill:none}
      .line{stroke:#9ca3af;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .soft{fill:#eef4ff;stroke:#b8ccff;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="560" rx="24"/>
  <text class="title" x="60" y="60">A 股 ESG 报告采集流程</text>
  <text class="small" x="60" y="92">通过巨潮资讯网公告检索接口获取公告元数据，再下载 PDF 并生成清单文件</text>

  <rect class="card" x="60" y="145" width="180" height="110" rx="14"/>
  <text class="text" x="95" y="188">关键词配置</text>
  <text class="small" x="86" y="220">ESG 报告 / 社会责任</text>
  <text class="small" x="94" y="244">可持续发展报告</text>

  <path class="line" d="M240 200 L305 200"/>
  <rect class="card" x="305" y="145" width="190" height="110" rx="14"/>
  <text class="text" x="344" y="188">POST 检索</text>
  <text class="small" x="334" y="220">pageNum / seDate</text>
  <text class="small" x="348" y="244">stock / searchkey</text>

  <path class="line" d="M495 200 L560 200"/>
  <rect class="card" x="560" y="145" width="190" height="110" rx="14"/>
  <text class="text" x="598" y="188">公告列表</text>
  <text class="small" x="592" y="220">announcements</text>
  <text class="small" x="590" y="244">标题 / 时间 / 附件</text>

  <path class="line" d="M750 200 L815 200"/>
  <rect class="card" x="815" y="145" width="170" height="110" rx="14"/>
  <text class="text" x="853" y="188">去重筛选</text>
  <text class="small" x="842" y="220">adjunctUrl 优先</text>
  <text class="small" x="846" y="244">仅保留 PDF</text>

  <path class="line" d="M985 200 L1045 200"/>
  <rect class="soft" x="1045" y="145" width="95" height="110" rx="14"/>
  <text class="text" x="1062" y="188">下载</text>
  <text class="small" x="1060" y="220">1MB</text>
  <text class="small" x="1055" y="244">分块写入</text>

  <path class="line" d="M1092 255 L1092 320 L905 320"/>
  <rect class="card" x="725" y="285" width="180" height="110" rx="14"/>
  <text class="text" x="760" y="328">安全命名</text>
  <text class="small" x="750" y="360">证券代码 + 年份</text>
  <text class="small" x="762" y="384">标题清洗</text>

  <path class="line" d="M725 340 L660 340"/>
  <rect class="card" x="470" y="285" width="190" height="110" rx="14"/>
  <text class="text" x="510" y="328">原始 PDF</text>
  <text class="small" x="514" y="360">保存至 raw/</text>
  <text class="small" x="500" y="384">进入后续预处理</text>

  <path class="line" d="M470 340 L405 340"/>
  <rect class="soft" x="215" y="285" width="190" height="110" rx="14"/>
  <text class="text" x="252" y="328">清单输出</text>
  <text class="small" x="244" y="360">CSV / JSON</text>
  <text class="small" x="245" y="384">来源可追溯</text>

  <path class="accent" d="M82 455 C280 505, 880 505, 1118 455"/>
  <text class="small" x="392" y="492">保留公告 URL、命中关键词、本地路径和下载字节数，用于批量解析与复核</text>
</svg>

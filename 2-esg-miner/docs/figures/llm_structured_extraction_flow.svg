<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .bg{fill:#f5f5f7}.card{fill:#fff;stroke:#d2d2d7;stroke-width:1.2}.soft{fill:#fafafa;stroke:#d2d2d7;stroke-width:1}.blue{fill:#eaf3ff;stroke:#8fc5ff;stroke-width:1.2}
      .text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#1d1d1f}.title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#6e6e73}.node{font-size:21px;font-weight:650}.small{font-size:16px;fill:#6e6e73}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;fill:#1d1d1f}
      .arrow{stroke:#86868b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.accent{stroke:#0071e3;stroke-width:2.6;fill:none;marker-end:url(#arrowBlue)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#86868b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#0071e3"/></marker>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="text title" x="70" y="74">大模型结构化抽取流程</text>
  <text class="text sub" x="70" y="112">字段定义与候选证据共同进入 Prompt，输出可校验的 JSON 结果</text>

  <rect class="card" x="80" y="185" width="260" height="130" rx="22"/>
  <text class="text node" x="210" y="238" text-anchor="middle">60 字段 Schema</text>
  <text class="text small" x="210" y="270" text-anchor="middle">字段名 / 类型 / 单位 / 搜索词</text>

  <rect class="card" x="80" y="410" width="260" height="130" rx="22"/>
  <text class="text node" x="210" y="463" text-anchor="middle">字段候选证据</text>
  <text class="text small" x="210" y="495" text-anchor="middle">field_contexts.json</text>

  <path class="arrow" d="M340 250 H470"/>
  <path class="arrow" d="M340 475 H470"/>

  <rect class="blue" x="470" y="260" width="300" height="210" rx="26"/>
  <text class="text node" x="620" y="320" text-anchor="middle">Prompt 构造</text>
  <text class="text small" x="620" y="352" text-anchor="middle">字段定义 + 证据文本</text>
  <text class="text small" x="620" y="384" text-anchor="middle">目标年份约束</text>
  <text class="text small" x="620" y="416" text-anchor="middle">JSON 输出格式</text>

  <path class="accent" d="M770 365 H890"/>
  <rect class="card" x="890" y="260" width="220" height="210" rx="26"/>
  <text class="text node" x="1000" y="335" text-anchor="middle">LLM 抽取</text>
  <text class="text small" x="1000" y="370" text-anchor="middle">value / unit / year</text>
  <text class="text small" x="1000" y="402" text-anchor="middle">evidence / confidence</text>

  <path class="arrow" d="M1110 365 H1210"/>
  <rect class="card" x="1210" y="205" width="150" height="320" rx="24"/>
  <text class="text node" x="1285" y="270" text-anchor="middle">JSON</text>
  <rect class="soft" x="1235" y="310" width="100" height="148" rx="12"/>
  <text class="mono" x="1250" y="340">matched</text>
  <text class="mono" x="1250" y="370">value</text>
  <text class="mono" x="1250" y="400">unit</text>
  <text class="mono" x="1250" y="430">year</text>

  <path class="arrow" d="M1285 525 V610 H965"/>
  <rect class="card" x="730" y="580" width="235" height="100" rx="22"/>
  <text class="text node" x="847.5" y="620" text-anchor="middle">目标年份对齐</text>
  <text class="text small" x="847.5" y="650" text-anchor="middle">多年份表格修正</text>
  <path class="arrow" d="M730 630 H610"/>

  <rect class="card" x="370" y="580" width="240" height="100" rx="22"/>
  <text class="text node" x="490" y="620" text-anchor="middle">质量校验</text>
  <text class="text small" x="490" y="650" text-anchor="middle">弱证据 / 单位 / 年份</text>
  <path class="accent" d="M370 630 H250"/>

  <rect class="card" x="80" y="580" width="170" height="100" rx="22"/>
  <text class="text node" x="165" y="620" text-anchor="middle">结果输出</text>
  <text class="text small" x="165" y="650" text-anchor="middle">JSON / CSV / DB</text>
</svg>

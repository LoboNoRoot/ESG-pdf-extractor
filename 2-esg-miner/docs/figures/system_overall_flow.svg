<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .bg{fill:#f5f5f7}
      .card{fill:#fff;stroke:#d2d2d7;stroke-width:1.2}
      .card2{fill:#fafafa;stroke:#d2d2d7;stroke-width:1.2}
      .text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;fill:#1d1d1f}
      .sub{font-size:20px;fill:#6e6e73}
      .title{font-size:34px;font-weight:700}
      .node{font-size:21px;font-weight:600}
      .small{font-size:16px;fill:#6e6e73}
      .arrow{stroke:#86868b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .accent{stroke:#0071e3;stroke-width:2.6;fill:none;marker-end:url(#arrowBlue)}
      .pill{fill:#eaf3ff;stroke:#b7d7ff;stroke-width:1}
      .pilltext{font-size:15px;fill:#0066cc;font-weight:600}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#86868b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0071e3"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="text title" x="70" y="74">系统整体处理流程</text>
  <text class="text sub" x="70" y="112">从 ESG 报告 PDF 到可复核、可导出、可分析的结构化指标数据</text>

  <g transform="translate(70 170)">
    <rect class="card" x="0" y="0" width="190" height="92" rx="18"/>
    <text class="text node" x="95" y="40" text-anchor="middle">PDF 上传</text>
    <text class="text small" x="95" y="66" text-anchor="middle">单份 / 批量报告</text>
  </g>
  <path class="arrow" d="M260 216 H330"/>

  <g transform="translate(330 170)">
    <rect class="card" x="0" y="0" width="190" height="92" rx="18"/>
    <text class="text node" x="95" y="40" text-anchor="middle">报告过滤</text>
    <text class="text small" x="95" y="66" text-anchor="middle">跳过摘要/鉴证声明</text>
  </g>
  <path class="arrow" d="M520 216 H590"/>

  <g transform="translate(590 170)">
    <rect class="card" x="0" y="0" width="190" height="92" rx="18"/>
    <text class="text node" x="95" y="40" text-anchor="middle">页级快扫</text>
    <text class="text small" x="95" y="66" text-anchor="middle">PyMuPDF 特征提取</text>
  </g>
  <path class="accent" d="M780 216 H850"/>

  <g transform="translate(850 170)">
    <rect class="card" x="0" y="0" width="205" height="92" rx="18"/>
    <text class="text node" x="102.5" y="40" text-anchor="middle">重点页解析</text>
    <text class="text small" x="102.5" y="66" text-anchor="middle">子 PDF + MinerU</text>
  </g>
  <path class="arrow" d="M1055 216 H1125"/>

  <g transform="translate(1125 170)">
    <rect class="card" x="0" y="0" width="205" height="92" rx="18"/>
    <text class="text node" x="102.5" y="40" text-anchor="middle">RAG 文本块</text>
    <text class="text small" x="102.5" y="66" text-anchor="middle">layout / text / MinerU</text>
  </g>

  <path class="arrow" d="M1228 262 V340"/>
  <g transform="translate(1005 340)">
    <rect class="card" x="0" y="0" width="325" height="98" rx="18"/>
    <text class="text node" x="162.5" y="42" text-anchor="middle">字段级证据召回</text>
    <text class="text small" x="162.5" y="70" text-anchor="middle">BM25 + Embedding + RRF</text>
  </g>
  <path class="arrow" d="M1005 389 H905"/>

  <g transform="translate(650 340)">
    <rect class="card" x="0" y="0" width="255" height="98" rx="18"/>
    <text class="text node" x="127.5" y="42" text-anchor="middle">大模型抽取</text>
    <text class="text small" x="127.5" y="70" text-anchor="middle">JSON 字段结果</text>
  </g>
  <path class="accent" d="M650 389 H550"/>

  <g transform="translate(270 340)">
    <rect class="card" x="0" y="0" width="280" height="98" rx="18"/>
    <text class="text node" x="140" y="42" text-anchor="middle">质量校验</text>
    <text class="text small" x="140" y="70" text-anchor="middle">年份 / 单位 / 弱证据</text>
  </g>
  <path class="arrow" d="M410 438 V520"/>

  <g transform="translate(270 520)">
    <rect class="card" x="0" y="0" width="280" height="98" rx="18"/>
    <text class="text node" x="140" y="42" text-anchor="middle">人工复核</text>
    <text class="text small" x="140" y="70" text-anchor="middle">确认 / 编辑 / 驳回</text>
  </g>
  <path class="arrow" d="M550 569 H650"/>

  <g transform="translate(650 520)">
    <rect class="card" x="0" y="0" width="280" height="98" rx="18"/>
    <text class="text node" x="140" y="42" text-anchor="middle">结果存储</text>
    <text class="text small" x="140" y="70" text-anchor="middle">PostgreSQL + 产物文件</text>
  </g>
  <path class="arrow" d="M930 569 H1030"/>

  <g transform="translate(1030 520)">
    <rect class="card" x="0" y="0" width="300" height="98" rx="18"/>
    <text class="text node" x="150" y="42" text-anchor="middle">输出与分析</text>
    <text class="text small" x="150" y="70" text-anchor="middle">JSON / CSV / ECharts</text>
  </g>

  <g transform="translate(70 665)">
    <rect class="pill" x="0" y="0" width="150" height="32" rx="16"/>
    <text class="text pilltext" x="75" y="21" text-anchor="middle">可追溯证据链</text>
    <rect class="pill" x="166" y="0" width="150" height="32" rx="16"/>
    <text class="text pilltext" x="241" y="21" text-anchor="middle">目标年份对齐</text>
    <rect class="pill" x="332" y="0" width="150" height="32" rx="16"/>
    <text class="text pilltext" x="407" y="21" text-anchor="middle">低成本解析</text>
  </g>
</svg>

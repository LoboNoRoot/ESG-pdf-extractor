<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2050 980" width="205mm" height="98mm">
  <style>
    svg { background: #FFFFFF; font-family: 'Times New Roman', 'SimHei', '黑体', sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: #0F172A; }
    .subtitle { font-size: 18px; font-weight: 500; fill: #64748B; }
    .column-title { font-size: 22px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .column-sub { font-size: 14px; font-weight: 500; fill: #E2E8F0; text-anchor: middle; }
    .item-card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
    .item-num { font-size: 12px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .item-title { font-size: 12px; font-weight: 700; fill: #1E293B; }
    .item-clause { font-size: 12px; font-weight: 600; text-anchor: end; }
    .pie-label { font-size: 12px; font-weight: 700; }
    .source { font-size: 11px; font-weight: 500; }
    .env-color { fill: #059669; }
    .env-bg { fill: #ECFDF5; }
    .env-border { stroke: #A7F3D0; }
    .env-text { fill: #047857; }
    .soc-color { fill: #2563EB; }
    .soc-bg { fill: #EFF6FF; }
    .soc-border { stroke: #BFDBFE; }
    .soc-text { fill: #1D4ED8; }
    .gov-color { fill: #D97706; }
    .gov-bg { fill: #FEF3C7; }
    .gov-border { stroke: #FDE68A; }
    .gov-text { fill: #B45309; }
  </style>

  <!-- Header -->
  <g transform="translate(60, 32)">
    <rect width="8" height="42" rx="4" fill="#059669" />
    <text x="24" y="31" class="title">《上市公司可持续发展报告指引》议题索引分布图</text>
    <text x="24" y="62" class="subtitle">涵盖环境、社会、可持续发展相关治理三大维度，共 21 项核心议题与对应条款索引</text>
  </g>

  <!-- Environment -->
  <g transform="translate(60, 140)">
    <rect width="620" height="62" rx="12" class="env-color" />
    <text x="310" y="29" class="column-title">环境 (Environmental)</text>
    <text x="310" y="50" class="column-sub">议题 1 - 8  |  共 8 项核心议题</text>
    <rect x="0" y="74" width="620" height="710" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <g transform="translate(20, 85)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="env-bg" /><text x="35" y="31" class="item-num env-text">01</text><text x="70" y="37" class="item-title">应对气候变化</text><rect x="395" y="17" width="165" height="28" rx="14" class="env-bg env-border" stroke-width="1" /><text x="545" y="36" class="item-clause env-text">第二十一条至第二十八条</text></g>
    <g transform="translate(20, 157)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="env-bg" /><text x="35" y="31" class="item-num env-text">02</text><text x="70" y="37" class="item-title">污染物排放</text><rect x="395" y="17" width="165" height="28" rx="14" class="env-bg env-border" stroke-width="1" /><text x="545" y="36" class="item-clause env-text">第三十条</text></g>
    <g transform="translate(20, 229)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="env-bg" /><text x="35" y="31" class="item-num env-text">03</text><text x="70" y="37" class="item-title">废弃物处理</text><rect x="395" y="17" width="165" height="28" rx="14" class="env-bg env-border" stroke-width="1" /><text x="545" y="36" class="item-clause env-text">第三十一条</text></g>
    <g transform="translate(20, 301)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="env-bg" /><text x="35" y="31" class="item-num env-text">04</text><text x="70" y="37" class="item-title">生态系统和生物多样性保护</text><rect x="395" y="17" width="165" height="28" rx="14" class="env-bg env-border" stroke-width="1" /><text x="545" y="36" class="item-clause env-text">第三十二条</text></g>
    <g transform="translate(20, 373)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="env-bg" /><text x="35" y="31" class="item-num env-text">05</text><text x="70" y="37" class="item-title">环境合规管理</text><rect x="395" y="17" width="165" height="28" rx="14" class="env-bg env-border" stroke-width="1" /><text x="545" y="36" class="item-clause env-text">第三十三条</text></g>
    <g transform="translate(20, 445)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="env-bg" /><text x="35" y="31" class="item-num env-text">06</text><text x="70" y="37" class="item-title">能源利用</text><rect x="395" y="17" width="165" height="28" rx="14" class="env-bg env-border" stroke-width="1" /><text x="545" y="36" class="item-clause env-text">第三十五条</text></g>
    <g transform="translate(20, 517)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="env-bg" /><text x="35" y="31" class="item-num env-text">07</text><text x="70" y="37" class="item-title">水资源利用</text><rect x="395" y="17" width="165" height="28" rx="14" class="env-bg env-border" stroke-width="1" /><text x="545" y="36" class="item-clause env-text">第三十六条</text></g>
    <g transform="translate(20, 589)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="env-bg" /><text x="35" y="31" class="item-num env-text">08</text><text x="70" y="37" class="item-title">循环经济</text><rect x="395" y="17" width="165" height="28" rx="14" class="env-bg env-border" stroke-width="1" /><text x="545" y="36" class="item-clause env-text">第三十七条</text></g>
  </g>

  <!-- Social -->
  <g transform="translate(715, 140)">
    <rect width="620" height="62" rx="12" class="soc-color" />
    <text x="310" y="29" class="column-title">社会 (Social)</text>
    <text x="310" y="50" class="column-sub">议题 9 - 17  |  共 9 项核心议题</text>
    <rect x="0" y="74" width="620" height="710" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <g transform="translate(20, 85)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">09</text><text x="70" y="37" class="item-title">乡村振兴</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第三十九条</text></g>
    <g transform="translate(20, 157)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">10</text><text x="70" y="37" class="item-title">社会贡献</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第四十条</text></g>
    <g transform="translate(20, 229)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">11</text><text x="70" y="37" class="item-title">创新驱动</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第四十二条</text></g>
    <g transform="translate(20, 301)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">12</text><text x="70" y="37" class="item-title">科技伦理</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第四十三条</text></g>
    <g transform="translate(20, 373)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">13</text><text x="70" y="37" class="item-title">供应链安全</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第四十五条</text></g>
    <g transform="translate(20, 445)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">14</text><text x="70" y="37" class="item-title">平等对待中小企业</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第四十六条</text></g>
    <g transform="translate(20, 517)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">15</text><text x="70" y="37" class="item-title">产品和服务安全与质量</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第四十七条</text></g>
    <g transform="translate(20, 589)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">16</text><text x="70" y="37" class="item-title">数据安全与客户隐私保护</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第四十八条</text></g>
    <g transform="translate(20, 661)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="soc-bg" /><text x="35" y="31" class="item-num soc-text">17</text><text x="70" y="37" class="item-title">员工</text><rect x="395" y="17" width="165" height="28" rx="14" class="soc-bg soc-border" stroke-width="1" /><text x="545" y="36" class="item-clause soc-text">第五十条</text></g>
  </g>

  <!-- Governance -->
  <g transform="translate(1370, 140)">
    <rect width="620" height="62" rx="12" class="gov-color" />
    <text x="310" y="28" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">可持续发展相关治理</text>
    <text x="310" y="50" class="column-sub">Governance  |  议题 18 - 21  |  共 4 项</text>
    <rect x="0" y="74" width="620" height="710" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <g transform="translate(20, 85)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="gov-bg" /><text x="35" y="31" class="item-num gov-text">18</text><text x="70" y="37" class="item-title">尽职调查</text><rect x="395" y="17" width="165" height="28" rx="14" class="gov-bg gov-border" stroke-width="1" /><text x="545" y="36" class="item-clause gov-text">第五十二条</text></g>
    <g transform="translate(20, 157)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="gov-bg" /><text x="35" y="31" class="item-num gov-text">19</text><text x="70" y="37" class="item-title">利益相关方沟通</text><rect x="395" y="17" width="165" height="28" rx="14" class="gov-bg gov-border" stroke-width="1" /><text x="545" y="36" class="item-clause gov-text">第五十三条</text></g>
    <g transform="translate(20, 229)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="gov-bg" /><text x="35" y="31" class="item-num gov-text">20</text><text x="70" y="37" class="item-title">反商业贿赂及反贪污</text><rect x="395" y="17" width="165" height="28" rx="14" class="gov-bg gov-border" stroke-width="1" /><text x="545" y="36" class="item-clause gov-text">第五十五条</text></g>
    <g transform="translate(20, 301)"><rect width="580" height="62" rx="10" class="item-card" /><rect x="16" y="12" width="38" height="38" rx="8" class="gov-bg" /><text x="35" y="31" class="item-num gov-text">21</text><text x="70" y="37" class="item-title">反不正当竞争</text><rect x="395" y="17" width="165" height="28" rx="14" class="gov-bg gov-border" stroke-width="1" /><text x="545" y="36" class="item-clause gov-text">第五十六条</text></g>

    <!-- Summary card -->
    <g transform="translate(20, 405)">
      <rect width="580" height="260" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <text x="290" y="30" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">指引议题分布占比（共 21 项）</text>
      <g transform="translate(18, 50)">
        <circle cx="140" cy="105" r="58" fill="none" stroke="#059669" stroke-width="26" stroke-dasharray="138.8 364.4" transform="rotate(-90 140 105)" />
        <circle cx="140" cy="105" r="58" fill="none" stroke="#2563EB" stroke-width="26" stroke-dasharray="156.2 364.4" stroke-dashoffset="-138.8" transform="rotate(-90 140 105)" />
        <circle cx="140" cy="105" r="58" fill="none" stroke="#D97706" stroke-width="26" stroke-dasharray="69.4 364.4" stroke-dashoffset="-295" transform="rotate(-90 140 105)" />
        <circle cx="140" cy="105" r="33" fill="#FFFFFF" />
        <text x="140" y="102" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">21 项</text>
        <text x="140" y="119" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">总计</text>
      </g>
      <g transform="translate(285, 70)" class="pie-label">
        <circle cx="8" cy="8" r="6" fill="#059669" /><text x="24" y="12" fill="#1E293B">环境 (E) 维度</text><text x="270" y="12" text-anchor="end" fill="#059669">8 项（38.1%）</text>
        <circle cx="8" cy="48" r="6" fill="#2563EB" /><text x="24" y="52" fill="#1E293B">社会 (S) 维度</text><text x="270" y="52" text-anchor="end" fill="#2563EB">9 项（42.9%）</text>
        <circle cx="8" cy="88" r="6" fill="#D97706" /><text x="24" y="92" fill="#1E293B">治理 (G) 维度</text><text x="270" y="92" text-anchor="end" fill="#D97706">4 项（19.0%）</text>
      </g>
      <text x="30" y="235" class="source" fill="#64748B">数据来源：沪深北交易所《上市公司可持续发展报告指引》</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="205mm" height="98mm" preserveAspectRatio="none" style="background-color: #FFFFFF; font-family: 'Times New Roman', 'SimHei', '黑体', sans-serif;">
  
  <style>
    .title { font-size: 32px; font-weight: 700; fill: #0F172A; font-family: 'Times New Roman', 'SimHei', '黑体', sans-serif; }
